# Static server for design-system/ — the standalone canvases, wordmark exports,
# screenshots and font source files. They are plain files with no build step, so
# nginx serves the directory as-is with an index listing to browse it.
server {
  listen 4340;
  server_name _;

  root /srv;
  charset utf-8;

  # Nothing here has an index.html; the listing *is* the entry point.
  autoindex on;
  autoindex_exact_size off;
  autoindex_localtime on;

  # Local-only design references — never let anything cache them stale.
  add_header Cache-Control "no-store";

  location / {
    try_files $uri $uri/ =404;
  }
}
