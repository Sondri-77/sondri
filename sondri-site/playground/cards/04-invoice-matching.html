  <script>
  (function () {
    function init() {
      var root = document.getElementById('c04-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var docs = Array.from(root.querySelectorAll('.c04-doc'));
      var rows = Array.from(root.querySelectorAll('.c04-row')).map(function(row) {

      var scanSpan = 140;
      var resize = new ResizeObserver(function() {

        var enter = Math.min(1, t / .7), leave = Math.max(0, (t - 8.3) / .9);
        docs.forEach(function(doc, i) {

        rows.forEach(function(row, i) {

          var scanning = age > 0 && age < .65;

          row.scan.style.transform = 'translateX(' + (Math.max(0, Math.min(1, age / .65)) * scanSpan - 24) + 'px)';
          row.flash.style.opacity = index !== 2 && age > .65 && age < .88 ? String(1 - (age - .65) / .23) : '0';
          row.wash.style.opacity = age > .65 && index !== 2 ? '1' : '0';
          row.mismatch.style.opacity = age > .65 && index === 2 ? '1' : '0';
        });
        status.forEach(function(label) { label.style.opacity = t > 3.45 ? '1' : '0'; });
        var slam = Math.max(0, Math.min(1, (t - 5.85) / .18));
        stamp.style.opacity = t > 5.85 && t < 8.3 ? '1' : '0';
        var shake = !reduced && t > 6.03 && t < 6.2 ? Math.sin(t * 130) * 2 : 0;
        stamp.style.transform = 'translateX(' + shake + 'px) rotate(-9deg) scale(' + (1.5 - slam * .5) + ')';

      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {

      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }

      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(7.5, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);

    motion.addEventListener('change', sync);

    }
