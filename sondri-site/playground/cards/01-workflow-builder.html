  <script>
  (function () {
    function init() {
      var root = document.getElementById('c01-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var nodes = Array.from(root.querySelectorAll('.c01-node'));
      var edges = Array.from(root.querySelectorAll('.c01-draw'));
      var packets = Array.from(root.querySelectorAll('.c01-packet'));
      var lengths = edges.map(function(path) { return path.getTotalLength(); });
      edges.forEach(function(path, i) { path.style.strokeDasharray = lengths[i]; });
      function render(time, dt, reduced) {
        var t = time % 9.4;
        nodes.forEach(function(node, i) {
          var age = t - i * .72;
          var scale = age < 0 ? .6 : age < .15 ? .6 + age / .15 * .48 : age < .184 ? 1.08 : 1;
          node.style.opacity = age < 0 ? '.12' : '1';
          node.style.transform = 'scale(' + (reduced ? 1 : scale) + ')';
        });
        edges.forEach(function(edge, i) {
          var start = (i < 4 ? i + 1 : 5) * .72;
          var progress = Math.max(0, Math.min(1, (t - start) / .35));
          edge.style.strokeDashoffset = lengths[i] * (1 - progress);
          var travel = ((t - start) * .7 + i * .2) % 1;
          var point = edge.getPointAtLength(Math.max(0, travel) * lengths[i]);
          packets[i].style.opacity = t >= start && !reduced ? '1' : '0';
          packets[i].setAttribute('transform', 'translate(' + (point.x - 2.5) + ' ' + (point.y - 2.5) + ')');
        });
      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {
      frame = 0;
      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }
      if (!visible || document.hidden || motion.matches) return;
      var dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(7.2, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);
      motion.removeEventListener('change', sync);
    }
    var observer = new IntersectionObserver(function(entries) {
      visible = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 });
    observer.observe(root);
    document.addEventListener('visibilitychange', sync);
    motion.addEventListener('change', sync);
    render(motion.matches ? 7.2 : 0, 0, motion.matches);

    }
    if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
  })();
  </script>
