<section class="card c03" data-card="agentic-chat" id="c03-root" aria-label="Agentic chat">
  <style>
.c03 { --field: #081f1f; --gold: #fdb343; --gold-hover: #f5a71e; --text: #e9edec; --muted: #9db6b4; --line: #c9dad7; --panel: #0c2b29; --paper: #edf5f4; --success: #6ee7a8; --risk: #ff6b6b; --mono: 'JetBrains Mono', 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; box-sizing: border-box; width: 100%; min-width: 0; min-height: 320px; height: 352px; padding: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 1px solid var(--text); border-radius: 0; box-shadow: 6px 6px 0 #000; color: var(--text); background-color: var(--field); background-image: radial-gradient(#1c3a39 1px, transparent 1px); background-size: 14px 14px; font-family: var(--sans); }
.c03 .c03-chrome { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px dotted var(--muted); flex: 0 0 auto; }
.c03 .c03-controls { display: flex; gap: 4px; flex: 0 0 auto; }
.c03 .c03-square { width: 8px; height: 8px; box-sizing: border-box; border: 1px solid var(--text); }
.c03 .c03-title { font: 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; margin: 0; font-weight: 400; }
.c03 .c03-stage { position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; padding: 12px 0; }
.c03 .c03-caption { margin: 0; color: var(--muted); font: 10px/1.5 var(--mono); white-space: nowrap; }
.c03 .c03-mono { font: 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.c03 .c03-window { background: var(--panel); border: 1px solid var(--line); box-shadow: 3px 3px 0 #000; min-width: 0; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { .c03 .c03-stage { scroll-behavior: auto; } }

.c03 .c03-window { width: 100%; height: 246px; overflow: hidden; display: flex; flex-direction: column; }
.c03 .c03-bar { padding: 9px 11px; border-bottom: 1px solid #36534f; display: flex; justify-content: space-between; font: 9px var(--mono); letter-spacing: .08em; color: var(--muted); }
.c03 .c03-live { color: var(--success); }
.c03 .c03-messages { padding: 12px; overflow: hidden; flex: 1; min-height: 0; }
.c03 .c03-user { background: var(--paper); color: var(--field); margin: 0 0 10px auto; width: fit-content; max-width: 88%; padding: 9px 11px; font: 12px/1.5 var(--sans); min-height: 18px; box-sizing: border-box; }
.c03 .c03-agent { border: 1px solid #45625d; padding: 9px 10px; width: 94%; box-sizing: border-box; min-height: 35px; }
.c03 .c03-who { display: flex; gap: 5px; align-items: center; color: var(--muted); font: 9px var(--mono); letter-spacing: .08em; }
.c03 .c03-dot { background: var(--gold); width: 3px; height: 3px; display: inline-block; }
.c03 .c03-chip { margin-top: 8px; padding: 6px; border: 1px solid var(--gold); color: var(--gold); font: 10px var(--mono); white-space: nowrap; }
.c03 .c03-tick { float: right; color: var(--success); }
.c03 .c03-result { color: var(--muted); font: 10px/1.4 var(--mono); margin-top: 6px; }
.c03 .c03-reply { font: 12px/1.5 var(--sans); margin: 7px 0 0; }
.c03 .c03-footer { padding: 8px 11px; border-top: 1px solid #36534f; font: 9px var(--mono); color: var(--muted); }
</style>
  <div class="c03-chrome"><span class="c03-controls" aria-hidden="true"><i class="c03-square"></i><i class="c03-square"></i><i class="c03-square"></i></span><h2 class="c03-title">03 · Agentic chat</h2></div>
  <div class="c03-stage"><div class="c03-window"><div class="c03-bar"><span>YOUR ASSISTANT</span><span class="c03-live">■ ONLINE</span></div><div class="c03-messages"><div class="c03-user"></div><div class="c03-agent"><div class="c03-who">AGENT <i class="c03-dot"></i><i class="c03-dot"></i><i class="c03-dot"></i></div><div class="c03-chip"><span class="c03-tool"></span><span class="c03-tick">✓</span></div><div class="c03-result"></div><p class="c03-reply"></p></div></div><div class="c03-footer">ASK → LOOK UP → TAKE ACTION</div></div></div>
  <p class="c03-caption">You ask. Your agent takes the next step.</p>
  <script>
  (function () {
    function init() {
      var root = document.getElementById('c03-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var exchanges = [
        ['Where is order #4471?', '⚙ lookup_order(#4471)', 'Found · out for delivery', 'Your order arrives today by 5 pm.'],
        ['Can you approve my refund?', '⚙ check_refund(#4471)', 'Eligible · within 30 days', 'Your refund is approved. Allow 3 days.'],
        ['Book a call for tomorrow.', '⚙ find_slot(tomorrow)', 'Available · 10:30 am', 'Your call is booked for 10:30 am.']
      ];
      var user = root.querySelector('.c03-user'), agent = root.querySelector('.c03-agent');
      var chip = root.querySelector('.c03-chip'), tool = root.querySelector('.c03-tool');
      var result = root.querySelector('.c03-result'), reply = root.querySelector('.c03-reply');
      var toolTick = root.querySelector('.c03-tick'), dots = Array.from(root.querySelectorAll('.c03-dot'));
      var messages = root.querySelector('.c03-messages');
      var lastText = '';
      function render(time, dt, reduced) {
        var exchange = exchanges[Math.floor(time / 8.6) % 3], t = time % 8.6;
        var typed = exchange[0].slice(0, Math.max(1, Math.floor(t * 30)));
        if (user.textContent !== typed) user.textContent = typed;
        agent.style.opacity = t > 1.1 ? '1' : '0';
        dots.forEach(function(dot, i) { dot.style.opacity = t < 2.7 && !reduced ? String(.2 + .8 * Math.max(0, Math.sin(t * 7 - i))) : '0'; });
        chip.style.display = t > 2.6 ? 'block' : 'none';
        if (tool.textContent !== exchange[1]) tool.textContent = exchange[1];
        toolTick.style.opacity = t > 3.5 ? '1' : '0';
        result.style.display = t > 3.5 ? 'block' : 'none';
        if (result.textContent !== exchange[2]) result.textContent = exchange[2];
        var text = exchange[3].slice(0, Math.max(0, Math.floor((t - 4) * 30)));
        if (text !== lastText) { reply.textContent = text; lastText = text; messages.scrollTop = 10000; }
      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {
      frame = 0;
      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }
      if (!visible || document.hidden || motion.matches) return;
      var dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(7.4, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);
      motion.removeEventListener('change', sync);
    }
    var observer = new IntersectionObserver(function(entries) {
      visible = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 });
    observer.observe(root);
    document.addEventListener('visibilitychange', sync);
    motion.addEventListener('change', sync);
    render(motion.matches ? 7.4 : 0, 0, motion.matches);

    }
    if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
  })();
  </script>
</section>
