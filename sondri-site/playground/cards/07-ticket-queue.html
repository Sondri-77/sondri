<section class="card c07" data-card="ticket-queue" id="c07-root" aria-label="Ticket queue">
  <style>
.c07 { --field: #081f1f; --gold: #fdb343; --gold-hover: #f5a71e; --text: #e9edec; --muted: #9db6b4; --line: #c9dad7; --panel: #0c2b29; --paper: #edf5f4; --success: #6ee7a8; --risk: #ff6b6b; --mono: 'JetBrains Mono', 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; box-sizing: border-box; width: 100%; min-width: 0; min-height: 320px; height: 352px; padding: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 1px solid var(--text); border-radius: 0; box-shadow: 6px 6px 0 #000; color: var(--text); background-color: var(--field); background-image: radial-gradient(#1c3a39 1px, transparent 1px); background-size: 14px 14px; font-family: var(--sans); }

.c07 .c07-caption { margin: 0; color: var(--muted); font: 10px/1.5 var(--mono); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) { .c07 .c07-stage { scroll-behavior: auto; } }

.c07 .c07-stage { align-items: center; gap: 14px; }

.c07 .c07-bar { height: 30px; padding: 0 8px; display: flex; justify-content: space-between; align-items: center; background: var(--panel); position: relative; z-index: 2; border-bottom: 1px solid var(--gold); color: var(--gold); font: 9px var(--mono); letter-spacing: .08em; }

  <div class="c07-chrome"><span class="c07-controls" aria-hidden="true"><i class="c07-square"></i><i class="c07-square"></i><i class="c07-square"></i></span><h2 class="c07-title">07 · Ticket queue</h2></div>

  <p class="c07-caption">Your queue gets shorter. Then disappears.</p>
  <script>
  (function () {
    function init() {
      var root = document.getElementById('c07-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var subjects = ['reset password', 'invoice copy', 'update address', 'order status', 'change plan', 'refund request', 'access request', 'delivery date', 'billing query', 'account unlock'];
      var rows = Array.from(root.querySelectorAll('.c07-row')).map(function(row) { return { el: row, id: row.querySelector('.c07-number'), text: row.querySelector('.c07-text') }; });
      var list = root.querySelector('.c07-list'), count = root.querySelector('.c07-count');
      var clear = root.querySelector('.c07-clear'), check = root.querySelector('.c07-check');
      var previousResolved = -1;
      function render(time, dt, reduced) {
        var t = time % 9.8;
        var progress = Math.min(48, Math.pow(Math.min(1, t / 7.6), 1.2) * 48);
        var resolved = Math.floor(progress), fraction = progress - resolved;
        var refill = t > 9.1 ? Math.min(1, (t - 9.1) / .7) : 0;
        if (refill) resolved = 0;
        count.textContent = String(48 - resolved);
        if (resolved !== previousResolved) {
          rows.forEach(function(row, i) {
            row.id.textContent = '#' + (5031 + resolved + i);
            row.text.textContent = subjects[(resolved + i) % subjects.length];
          });
          previousResolved = resolved;
        }
        list.style.transform = 'translateY(' + (refill ? (1 - refill) * 235 : -fraction * 21) + 'px)';
        rows.forEach(function(row, i) {
          row.el.style.opacity = resolved + i >= 48 ? '0' : i === 0 && !refill ? String(1 - fraction) : '1';
          row.el.style.transform = i === 0 && !refill ? 'translateX(-' + fraction * 90 + 'px)' : 'none';
        });
        check.style.opacity = reduced || fraction > .45 || resolved === 48 ? '1' : '.2';
        clear.style.opacity = resolved === 48 ? '1' : '0';
      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {
      frame = 0;
      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }
      if (!visible || document.hidden || motion.matches) return;
      var dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(8.2, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);
      motion.removeEventListener('change', sync);
    }
    var observer = new IntersectionObserver(function(entries) {
      visible = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 });
    observer.observe(root);
    document.addEventListener('visibilitychange', sync);
    motion.addEventListener('change', sync);
    render(motion.matches ? 8.2 : 0, 0, motion.matches);

    }
    if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
  })();
  </script>
</section>
