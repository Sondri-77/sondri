<section class="card c05" data-card="swimlane-race" id="c05-root" aria-label="Swimlane race">
  <style>
.c05 { --field: #081f1f; --gold: #fdb343; --gold-hover: #f5a71e; --text: #e9edec; --muted: #9db6b4; --line: #c9dad7; --panel: #0c2b29; --paper: #edf5f4; --success: #6ee7a8; --risk: #ff6b6b; --mono: 'JetBrains Mono', 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; box-sizing: border-box; width: 100%; min-width: 0; min-height: 320px; height: 352px; padding: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 1px solid var(--text); border-radius: 0; box-shadow: 6px 6px 0 #000; color: var(--text); background-color: var(--field); background-image: radial-gradient(#1c3a39 1px, transparent 1px); background-size: 14px 14px; font-family: var(--sans); }

@media (prefers-reduced-motion: reduce) { .c05 .c05-stage { scroll-behavior: auto; } }

.c05 .c05-stage { flex-direction: column; justify-content: center; align-items: stretch; gap: 22px; }

.c05 .c05-stop:first-child { align-items: flex-start; }
.c05 .c05-stop:last-child { align-items: flex-end; }
.c05 .c05-mark { display: block; width: 9px; height: 9px; background: var(--field); border: 1px solid var(--muted); }
.c05 .c05-label { font: 9px/1.45 var(--sans); color: var(--muted); text-align: center; }

.c05 .c05-auto .c05-rail { background: #fdb34366; }

</style>

  <script>
  (function () {
    function init() {
      var root = document.getElementById('c05-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var tracks = Array.from(root.querySelectorAll('.c05-track'));
      var tokens = Array.from(root.querySelectorAll('.c05-token'));
      var timers = Array.from(root.querySelectorAll('.c05-time'));
      var saving = root.querySelector('.c05-saving');
      var spans = [280, 280];
      var positions = [];
      var resize = new ResizeObserver(function() {
        tracks.forEach(function(track, i) {
          var bounds = track.getBoundingClientRect();
          spans[i] = bounds.width - 11;
          positions[i] = Array.from(track.querySelectorAll('.c05-mark')).map(function(mark) { return mark.getBoundingClientRect().left - bounds.left; });
        });
        if (motion.matches) render(8, 0, true);
      });
      tracks.forEach(function(track) { resize.observe(track); });
      function clock(value) { return '00:' + value.toFixed(1).padStart(4, '0'); }
      function render(time) {
        var t = time % 9.7;
        var manual = Math.min(7.4, t), auto = Math.min(2.1, t);
        var segment = manual / 7.4 * 5;
        var part = Math.max(0, Math.min(1, (segment % 1 - .42) / .58));
        var index = Math.min(4, Math.floor(segment));
        var stops = positions[0] || [0, spans[0] * .2, spans[0] * .4, spans[0] * .6, spans[0] * .8, spans[0]];
        var x = manual >= 7.4 ? spans[0] : stops[index] + (stops[index + 1] - stops[index]) * part;
        tokens[0].style.transform = 'translateX(' + x + 'px)';
        tokens[1].style.transform = 'translateX(' + Math.max(0, Math.min(1, (auto - .25) / 1.85)) * spans[1] + 'px)';
        timers[0].textContent = clock(manual); timers[1].textContent = clock(auto);
        saving.style.opacity = t >= 7.4 ? '1' : '0';
        saving.style.transform = 'translateY(' + (t >= 7.4 ? 0 : 8) + 'px)';
      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {
      frame = 0;
      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }
      if (!visible || document.hidden || motion.matches) return;
      var dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(8, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);
      motion.removeEventListener('change', sync);
    }
    var observer = new IntersectionObserver(function(entries) {
      visible = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 });
    observer.observe(root);
    document.addEventListener('visibilitychange', sync);
    motion.addEventListener('change', sync);
    render(motion.matches ? 8 : 0, 0, motion.matches);

    }
    if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
  })();
  </script>
