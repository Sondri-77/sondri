<section class="card c02" data-card="knowledge-graph" id="c02-root" aria-label="Knowledge graph">
  <style>
.c02 { --field: #081f1f; --gold: #fdb343; --gold-hover: #f5a71e; --text: #e9edec; --muted: #9db6b4; --line: #c9dad7; --panel: #0c2b29; --paper: #edf5f4; --success: #6ee7a8; --risk: #ff6b6b; --mono: 'JetBrains Mono', 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; box-sizing: border-box; width: 100%; min-width: 0; min-height: 320px; height: 352px; padding: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 1px solid var(--text); border-radius: 0; box-shadow: 6px 6px 0 #000; color: var(--text); background-color: var(--field); background-image: radial-gradient(#1c3a39 1px, transparent 1px); background-size: 14px 14px; font-family: var(--sans); }
.c02 .c02-chrome { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px dotted var(--muted); flex: 0 0 auto; }
.c02 .c02-controls { display: flex; gap: 4px; flex: 0 0 auto; }
.c02 .c02-square { width: 8px; height: 8px; box-sizing: border-box; border: 1px solid var(--text); }
.c02 .c02-title { font: 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; margin: 0; font-weight: 400; }
.c02 .c02-stage { position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; padding: 12px 0; }
.c02 .c02-caption { margin: 0; color: var(--muted); font: 10px/1.5 var(--mono); white-space: nowrap; }
.c02 .c02-mono { font: 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.c02 .c02-window { background: var(--panel); border: 1px solid var(--line); box-shadow: 3px 3px 0 #000; min-width: 0; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { .c02 .c02-stage { scroll-behavior: auto; } }

.c02 .c02-stage { display: block; padding: 0; }
.c02 .c02-canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
.c02 .c02-meta { position: absolute; left: 0; top: 15px; pointer-events: none; color: var(--muted); font: 10px var(--mono); letter-spacing: .06em; }
.c02 .c02-hint { position: absolute; bottom: 10px; right: 0; color: var(--gold); pointer-events: none; font: 9px var(--mono); letter-spacing: .08em; }
</style>
  <div class="c02-chrome"><span class="c02-controls" aria-hidden="true"><i class="c02-square"></i><i class="c02-square"></i><i class="c02-square"></i></span><h2 class="c02-title">02 · Knowledge graph</h2></div>
  <div class="c02-stage"><canvas class="c02-canvas" role="img" aria-label="Thirty connected knowledge nodes. Move your pointer to pull nearby nodes toward it."></canvas><div class="c02-meta">30 NOTES / 45 LINKS</div><div class="c02-hint">MOVE TO EXPLORE ↗</div></div>
  <p class="c02-caption">Your knowledge, connected.</p>
  <script>
  (function () {
    function init() {
      var root = document.getElementById('c02-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var canvas = root.querySelector('.c02-canvas');
      var ctx = canvas.getContext('2d');
      var width = 320, height = 260, bounds;
      var pointer = { x: 0, y: 0, active: false, strength: 0 };
      var nodes = Array.from({length: 30}, function(_, i) {
        var angle = i * 2.399963;
        var radius = Math.sqrt((i + 1) / 30) * .40;
        return { x: .5 + Math.cos(angle) * radius, y: .52 + Math.sin(angle) * radius,
          ax: .5 + Math.cos(angle) * radius, ay: .52 + Math.sin(angle) * radius,
          vx: 0, vy: 0, r: i < 4 ? 5 : 2.3 + (i % 3) * .45 };
      });
      var edges = [];
      for (var i = 0; i < 30; i++) edges.push([i, (i + 5) % 30]);
      for (var j = 0; j < 15; j++) edges.push([j, (j + 11) % 30]);
      function measure() {
        bounds = canvas.getBoundingClientRect();
        width = bounds.width; height = bounds.height;
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (typeof motion !== 'undefined') render(motion.matches ? 5.5 : elapsed, 0, motion.matches);
      }
      var resize = new ResizeObserver(measure);
      resize.observe(canvas);
      root.addEventListener('pointermove', function(event) {
        if (motion.matches) return;
        bounds = canvas.getBoundingClientRect();
        pointer.x = event.clientX - bounds.left; pointer.y = event.clientY - bounds.top;
        pointer.active = true;
      });
      function release() { pointer.active = false; }
      root.addEventListener('pointerleave', release);
      root.addEventListener('pointerup', function(event) { if (event.pointerType !== 'mouse') release(); });
      root.addEventListener('pointercancel', release);
      function render(time, dt, reduced) {
        if (!ctx || !width || !height) return;
        var step = Math.min(dt * 60, 2);
        pointer.strength += ((pointer.active ? 1 : 0) - pointer.strength) * Math.min(1, dt * 5);
        if (!reduced && dt) {
          nodes.forEach(function(n, i) {
            n.vx += ((n.ax - n.x) * .0018 + (.5 - n.x) * .00012 + Math.sin(time * .5 + i) * .000015) * step;
            n.vy += ((n.ay - n.y) * .0018 + (.5 - n.y) * .00012 + Math.cos(time * .5 + i) * .000015) * step;
            nodes.forEach(function(other, k) {
              if (i === k) return;
              var dx = n.x - other.x, dy = n.y - other.y;
              var d2 = dx * dx + dy * dy + .001;
              n.vx += dx / d2 * .0000014 * step;
              n.vy += dy / d2 * .0000014 * step;
            });
            var px = pointer.x - n.x * width, py = pointer.y - n.y * height;
            var distance = Math.hypot(px, py);
            var pull = Math.max(0, 1 - distance / 140) * pointer.strength * .009;
            n.vx += px / width * pull * step; n.vy += py / height * pull * step;
          });
          edges.forEach(function(edge) {
            var a = nodes[edge[0]], b = nodes[edge[1]];
            var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01;
            var force = (d - .23) * .00025 * step;
            a.vx += dx / d * force; a.vy += dy / d * force;
            b.vx -= dx / d * force; b.vy -= dy / d * force;
          });
          nodes.forEach(function(n) {
            n.vx *= Math.pow(.86, step); n.vy *= Math.pow(.86, step);
            n.x = Math.max(.07, Math.min(.93, n.x + n.vx * step));
            n.y = Math.max(.17, Math.min(.89, n.y + n.vy * step));
          });
        }
        ctx.clearRect(0, 0, width, height);
        var lit = Math.floor(time / 4) % 30, phase = time % 4;
        edges.forEach(function(edge) {
          var a = nodes[edge[0]], b = nodes[edge[1]];
          var near = Math.max(0, 1 - Math.hypot(pointer.x - (a.x + b.x) * width / 2, pointer.y - (a.y + b.y) * height / 2) / 140) * pointer.strength;
          var signal = (edge[0] === lit || edge[1] === lit) && phase < 1.8;
          ctx.strokeStyle = signal ? '#fdb343' : 'rgba(157,182,180,' + (.22 + near * .65) + ')';
          ctx.lineWidth = signal ? 1.3 : .8;
          ctx.beginPath(); ctx.moveTo(a.x * width, a.y * height); ctx.lineTo(b.x * width, b.y * height); ctx.stroke();
          if (signal) {
            var from = edge[0] === lit ? a : b, to = edge[0] === lit ? b : a;
            var progress = Math.min(1, phase / 1.2);
            ctx.fillStyle = '#fdb343';
            ctx.fillRect((from.x + (to.x - from.x) * progress) * width - 2, (from.y + (to.y - from.y) * progress) * height - 2, 4, 4);
          }
        });
        nodes.forEach(function(n, i) {
          var neighbor = phase > 1 && phase < 2.2 && edges.some(function(e) { return (e[0] === lit && e[1] === i) || (e[1] === lit && e[0] === i); });
          ctx.fillStyle = i === lit || neighbor ? '#fdb343' : i < 4 ? '#e9edec' : '#9db6b4';
          ctx.beginPath(); ctx.arc(n.x * width, n.y * height, n.r, 0, Math.PI * 2); ctx.fill();
          if (i === lit) { ctx.strokeStyle = '#fdb34366'; ctx.strokeRect(n.x * width - 9, n.y * height - 9, 18, 18); }
        });
        ctx.font = '10px ui-monospace, monospace';
        var labels = [];
        ['YOUR DOCS', 'PEOPLE', 'PROJECTS'].forEach(function(label, i) {
          var n = nodes[i], w = label.length * 6 + 6;
          var offsets = [[10, -19], [-w - 10, 8], [10, 12], [-w - 10, -22], [-w / 2, -40], [-w / 2, 32]];
          var box;
          for (var choice = 0; choice < offsets.length; choice++) {
            box = { x: Math.max(3, Math.min(width - w - 3, n.x * width + offsets[choice][0])),
              y: Math.max(42, Math.min(height - 32, n.y * height + offsets[choice][1])), w: w };
            if (!labels.some(function(other) { return box.x < other.x + other.w + 5 && box.x + w + 5 > other.x && box.y < other.y + 19 && box.y + 19 > other.y; })) break;
          }
          labels.push(box);
          ctx.strokeStyle = '#54716d'; ctx.lineWidth = .7;
          ctx.beginPath(); ctx.moveTo(n.x * width, n.y * height); ctx.lineTo(box.x + w / 2, box.y + 7); ctx.stroke();
          ctx.fillStyle = '#081f1f'; ctx.fillRect(box.x - 2, box.y - 1, w + 4, 14);
          ctx.fillStyle = '#e9edec'; ctx.fillText(label, box.x + 3, box.y + 10);
        });
      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {
      frame = 0;
      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }
      if (!visible || document.hidden || motion.matches) return;
      var dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(5.5, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);
      motion.removeEventListener('change', sync);
    }
    var observer = new IntersectionObserver(function(entries) {
      visible = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 });
    observer.observe(root);
    document.addEventListener('visibilitychange', sync);
    motion.addEventListener('change', sync);
    render(motion.matches ? 5.5 : 0, 0, motion.matches);

    }
    if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
  })();
  </script>
</section>
