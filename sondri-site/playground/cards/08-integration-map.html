  <script>
  (function () {
    function init() {
      var root = document.getElementById('c08-root');
      if (!root || root.dataset.inited) return;
      root.dataset.inited = '1';

      var wires = Array.from(root.querySelectorAll('.c08-wire'));
      var packets = Array.from(root.querySelectorAll('.c08-packet'));
      var lengths = wires.map(function(wire) { return wire.getTotalLength(); });
      var flash = root.querySelector('.c08-hub-flash');
      function render(time, dt, reduced) {
        var brightest = 0;
        packets.forEach(function(packet, i) {
          var wire = i % 5;
          var phase = (time / 2.8 + i * .173) % 1;
          var progress = i < 5 ? phase : 1 - phase;
          var point = wires[wire].getPointAtLength(progress * lengths[wire]);
          packet.setAttribute('transform', 'translate(' + (point.x - 2.5) + ' ' + (point.y - 2.5) + ')');
          if (i < 5) brightest = Math.max(brightest, Math.max(0, (phase - .87) / .13));
        });
        flash.style.opacity = String(reduced ? .12 : brightest * .32);
      }


    var motion = matchMedia('(prefers-reduced-motion: reduce)');
    var visible = false;
    var frame = 0;
    var previous = 0;
    var elapsed = 0;
    function tick(now) {
      frame = 0;
      if (!root.isConnected) { observer.disconnect(); cleanup(); return; }
      if (!visible || document.hidden || motion.matches) return;
      var dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
      previous = now;
      elapsed += dt;
      render(elapsed, dt, false);
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      cancelAnimationFrame(frame);
      frame = 0;
      previous = 0;
      if (motion.matches) render(4.4, 0, true);
      else if (visible && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function cleanup() {
      document.removeEventListener('visibilitychange', sync);
      motion.removeEventListener('change', sync);
    }
    var observer = new IntersectionObserver(function(entries) {
      visible = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 });
    observer.observe(root);
    document.addEventListener('visibilitychange', sync);
    motion.addEventListener('change', sync);
    render(motion.matches ? 4.4 : 0, 0, motion.matches);

    }
    if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
