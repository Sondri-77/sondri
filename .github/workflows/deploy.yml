name: Deploy to Cloudflare Workers

# Auto-deploy the Astro site to Cloudflare Workers on every push to main
# that touches the site. Manual runs are also allowed from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'sondri-site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Prevent overlapping deploys; a newer push cancels an in-flight one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sondri-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: sondri-site
          # Use the project's own wrangler v4 (package.json), not the action's
          # bundled v3 — v3 doesn't understand the static-assets config.
          wranglerVersion: '4.26.0'
          # account_id is read from wrangler.jsonc; command deploys ./dist
          command: deploy
