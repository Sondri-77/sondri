name: Sondri Billing & Platform CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Tests, Typechecks & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Root Dependencies
        run: bun install --frozen-lockfile

      - name: Install Billing Worker Dependencies
        run: bun install --frozen-lockfile --cwd billing-worker

      - name: Install Website Dependencies
        run: bun install --frozen-lockfile --cwd sondri-site

      - name: Run Billing Worker Typecheck
        run: bun run --cwd billing-worker typecheck

      - name: Run Billing Worker Unit Tests
        run: bun run --cwd billing-worker test

      - name: Run Astro Website Typecheck & Diagnostics
        run: bun run --cwd sondri-site check

      - name: Verify Production Website Build
        run: bun run --cwd sondri-site build
