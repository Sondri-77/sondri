name = "sondri-billing-worker"
main = "src/index.ts"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ce4bcc9130b13b4acc8c5e597ba93f3a"
workers_dev = false
preview_urls = false

# Routes and Domains
routes = [
  { pattern = "billing.sondri.ai", custom_domain = true }
]

# Cloudflare D1 Database (caching domain audits, storing leads & daily rate limits)
# Local dev (`wrangler dev`) uses a local SQLite instance automatically.
[[d1_databases]]
binding = "DB"
database_name = "sondri-audits"
database_id = "d107a765-0a59-4fae-a098-9aedf9b06849"
migrations_dir = "migrations"

[observability]
enabled = true
